  "description": "Generate independent complete route hypotheses and explicit stereochemical control plans using retrieved literature.",
  "sci_requires": ">=0.1.1",
  "instructions": "instructions.md",
  "output": "Prefer the unchanged compact verification output with exactly status=completed, receipt_id and response_sha256, requested through compact_handoff=true. Full verified routes remain in the persisted receipt and are revalidated by Main. Legacy full envelopes with status, result and receipt_id remain supported; failed verification retains diagnostics. Main uses its explicitly installed owner plugin accept_specialist_retrosynthesis_result, passing the actual installed specialist name (including renames), final_envelope unchanged, and original target, requested_count, max_depth and max_total_reactions. The pinned dependency contains this owner bridge; recipient owner-plugin setup is required. Main must preserve original task constraints and accept only an authentic verification receipt. Graph acceptance is not chemical validation.",
  "automatic": true,
  "tools": [
    "read_retrosynthesis_task",
    "inspect_target_stereochemistry",
    "search_route_literature",
    "validate_route_hypotheses",
    "verify_retrosynthesis_result"
  ],
