schema_version: 2
id: antibody-specialist
name: antibody-specialist
version: 1.0.0
authors:
  - Naga Jyothi
license: MIT
description: Lead monoclonal research for the owning MAIN executor.
sci_requires: '>=0'
instructions: instructions.md
output: Concise evidence-backed phase return with actual run IDs, sources/artifact paths and hashes, uncertainties, stage blockers and next MAIN action; follow the selected handoff schema when requested.
automatic: false
tools:
    - delegate_task
    - read_file
    - search_files
skills:
  - id: monoclonal-research-team
    kind: package
    path: skills/monoclonal-research-team
  - id: monoclonal-research-handoffs
    kind: package
    path: skills/monoclonal-research-handoffs
dependencies: []
references: []
limits:
  max_iterations: 160
  timeout_seconds: 0
platforms:
  - any
fixtures:
  - input: tests/fixture.json
    expected: tests/expected.json
    description: Synthetic monoclonal research fixture with observable counts.
children:
  - role: coordinator
    package: monoclonal-research-coordinator
    version: '>=1.0.0,<2.0.0'
