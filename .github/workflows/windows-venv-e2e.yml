name: PR113 native Windows bytecode verification
on:
  push:
    branches: ['wine2e/**']
permissions:
  contents: read
jobs:
  launcher-bytecode:
    name: Launcher and bytecode scope (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - name: Check out exact PR repair
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 5a9870be6412e68cb2efbed0b36abaa8d787b6e7
          persist-credentials: false
      - name: Set up native ARM64 build dependencies
        if: runner.arch == 'ARM64'
        uses: ./.github/actions/setup-windows-build-deps
      - name: Set up locked test environment
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
          prune-python-cache: true
      - name: Run original launcher checks and bytecode-scope regressions
        shell: bash
        run: |
          bash scripts/run_tests.sh tests/scripts/test_mint_launchers.py tests/scripts/test_runner_bytecode_scope.py tests/scripts/test_catalog_source_cache.py -j 1 --file-retries 0 -q
