name: Windows PATH acceptance

on:
  push:
    branches: ['wine2e-path/**']

permissions:
  contents: read

jobs:
  windows-path:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-pm
      - name: Prepare isolated acceptance dependencies
        shell: bash
        run: python -m scripts.ci.python_packages pytest==9.1.1 pytest-asyncio==1.3.0 pytest-timeout==2.4.0 ruamel.yaml==0.18.17 packaging==26.0
      - name: Register, install, and resolve commands in new shells
        shell: bash
        env:
          SCI_E2E_WINDOWS_INSTALL: '1'
          SCI_E2E_ARTIFACTS: ${{ runner.temp }}/sci-path-evidence
          SCI_E2E_MACHINE_ROOT: C:\sp
          SCI_TEST_FILE_RETRIES: '0'
          SCI_TEST_FILE_TIMEOUT: '2600'
        run: scripts/run_tests.sh -j 1 tests/scripts/install/test_windows_path_lifecycle.py -- -m integration -v --tb=short -o addopts=
      - name: Verify installer rejects unusable short commands
        if: always()
        shell: bash
        env:
          SCI_TEST_FILE_RETRIES: '0'
        run: scripts/run_tests.sh -j 1 tests/scripts/install/test_windows_public_commands.py tests/scripts/install/test_windows_user_installer.py tests/scripts/install/test_windows_cmd_wrapper.py tests/sci_cli/test_install_paths.py -- -v --tb=short -o addopts=
      - name: Upload installation and fresh-shell evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-path-evidence
          path: ${{ runner.temp }}/sci-path-evidence
